name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows è la piattaforma di riferimento; Linux e macOS girano per sapere
    # se e dove si rompono, senza bloccare la pipeline: node-pty non pubblica un
    # prebuild per linux e lì `npm ci` deve compilare.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
