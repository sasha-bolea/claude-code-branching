<svg xmlns="http://www.w3.org/2000/svg" width="648" height="462" viewBox="0 0 648 462" font-family="SFMono-Regular, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14">
  <style>
    .f { opacity: 0; animation: ciclo 20s infinite; }
    @keyframes ciclo {
      0%   { opacity: 0 }
      1%   { opacity: 1 }
      24.00%  { opacity: 1 }
      25.00%  { opacity: 0 }
      100% { opacity: 0 }
    }
  </style>
  <rect width="648" height="462" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g class="f" style="animation-delay:0s">
    <text x="22" y="41" textLength="273.70" lengthAdjust="spacingAndGlyphs" fill="#e8913a">  cb  branches of the conversation</text>
    <text x="22" y="60" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="79" textLength="313.95" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ◯ restart here   ┳ fork   © compacted</text>
    <text x="22" y="98" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="117" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="136" textLength="249.55" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ⬤━━━⬤━━━⬤━━━⬤━┳━⬤━━━⬤━━━⬤━━━⬤</text>
    <text x="22" y="155" textLength="217.35" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">                ┗━⬤━┳━⬤━━━◯</text>
    <text x="22" y="174" textLength="249.55" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">                    ┗━⬤━━━⬤━━━⬤</text>
    <text x="22" y="193" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="212" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ╭────────────────────────────────────────────────────────────────────╮</text>
    <text x="22" y="231" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  │ 24-07 15:51  +42 -7  restart here                                  │</text>
    <text x="22" y="250" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  │ the app got very slow, rendering the list freezes                  │</text>
    <text x="22" y="269" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text x="22" y="288" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="307" textLength="96.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  earlier: 3</text>
    <text x="22" y="326" textLength="289.80" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    24-07 15:40  add the date filter</text>
    <text x="22" y="345" textLength="338.10" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    24-07 15:12  put the name sorting back</text>
    <text x="22" y="364" textLength="346.15" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    24-07 15:10  let's do the customer list</text>
    <text x="22" y="383" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="402" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="421" textLength="587.65" lengthAdjust="spacingAndGlyphs" fill="#8b949e">  ←→↑↓ wasd pick the point   enter restart   p queue   n notes   esc exit</text>
  </g>
  <g class="f" style="animation-delay:5s">
    <text x="22" y="41" textLength="273.70" lengthAdjust="spacingAndGlyphs" fill="#e8913a">  cb  branches of the conversation</text>
    <text x="22" y="60" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="79" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="98" textLength="249.55" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ⬤━━━⬤━━━⬤━━━⬤━┳━⬤━━━⬤━━━⬤━━━⬤</text>
    <text x="22" y="117" textLength="217.35" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">                ┗━⬤━┳━⬤━━━◯</text>
    <text x="22" y="136" textLength="249.55" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">                    ┗━⬤━━━⬤━━━⬤</text>
    <text x="22" y="155" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="174" textLength="177.10" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  what do I roll back?</text>
    <text x="22" y="193" textLength="297.85" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ▸ 1. the conversation and the files</text>
    <text x="22" y="212" textLength="426.65" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    2. the conversation only (files stay as they are)</text>
    <text x="22" y="231" textLength="466.90" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    3. the files only (the conversation stays where it is)</text>
    <text x="22" y="250" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="269" textLength="515.20" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    ←→  the prompt you picked stays sent, with the answer it got</text>
    <text x="22" y="288" textLength="313.95" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">     r  [ ] remember this for next time</text>
    <text x="22" y="307" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="326" textLength="547.40" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  The branch you leave is not lost: it stays in the tree, set aside.</text>
    <text x="22" y="345" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="364" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="383" textLength="418.60" lengthAdjust="spacingAndGlyphs" fill="#8b949e">  ↑↓ 1-3 pick   enter confirm   esc back   canc exit</text>
  </g>
  <g class="f" style="animation-delay:10s">
    <text x="22" y="41" textLength="144.90" lengthAdjust="spacingAndGlyphs" fill="#e8913a">  cb  prompt queue</text>
    <text x="22" y="60" textLength="450.80" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  they go out one at a time, when Claude finishes a turn</text>
    <text x="22" y="79" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="98" textLength="152.95" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  4 prompts waiting</text>
    <text x="22" y="117" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="136" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="155" textLength="225.40" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">     1. fix the failing test</text>
    <text x="22" y="174" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="193" textLength="265.65" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">     2. update the README  ⤼ skip</text>
    <text x="22" y="212" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="231" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ╭────────────────────────────────────────────────────────────────────╮</text>
    <text x="22" y="250" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  │  3. ‖ stop bump the version█                                       │</text>
    <text x="22" y="269" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text x="22" y="288" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="307" textLength="185.15" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">     4. make the commit</text>
    <text x="22" y="326" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="345" textLength="144.90" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    queue a prompt</text>
    <text x="22" y="364" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="383" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="402" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#8b949e">  enter queue   ↑↓ pick and edit   ctrl+↑↓ move   ctrl+canc remove   esc</text>
  </g>
  <g class="f" style="animation-delay:15s">
    <text x="22" y="41" textLength="88.55" lengthAdjust="spacingAndGlyphs" fill="#e8913a">  cb  notes</text>
    <text x="22" y="60" textLength="499.10" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  of C:\Users\me\projects\web — the same in every session here</text>
    <text x="22" y="79" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="98" textLength="72.45" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  2 notes</text>
    <text x="22" y="117" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="136" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="155" textLength="72.45" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    Ports</text>
    <text x="22" y="174" textLength="386.40" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    4310 and 4311 are already taken by omniroute</text>
    <text x="22" y="193" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="212" textLength="418.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">    remember to publish before touching the profiles</text>
    <text x="22" y="231" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="250" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ╭────────────────────────────────────────────────────────────────────╮</text>
    <text x="22" y="269" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  │ New note                                                           │</text>
    <text x="22" y="288" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  │                                                                    │</text>
    <text x="22" y="307" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  │ typing in here█                                                    │</text>
    <text x="22" y="326" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text x="22" y="345" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="364" textLength="595.70" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  They belong to the folder, not to the conversation: they outlive /clear.</text>
    <text x="22" y="383" textLength="0.00" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"></text>
    <text x="22" y="402" textLength="579.60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text x="22" y="421" textLength="603.75" lengthAdjust="spacingAndGlyphs" fill="#8b949e">  enter save   shift+enter new line   ctrl+enter send   ctrl+f search   esc</text>
  </g>
</svg>
