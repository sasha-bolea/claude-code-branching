    <text xml:space="preserve" x="22" y="269" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text xml:space="preserve" x="22" y="288" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="307" fill="#c9d1d9">  earlier: 2</text>
