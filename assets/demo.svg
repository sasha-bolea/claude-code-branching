    <text xml:space="preserve" x="22" y="155" fill="#c9d1d9">     1. fix the failing test</text>
    <text xml:space="preserve" x="22" y="174" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="193" fill="#c9d1d9">     2. update the README  » skip</text>
    <text xml:space="preserve" x="22" y="212" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="231" fill="#c9d1d9">  ╭────────────────────────────────────────────────────────────────────╮</text>
    <text xml:space="preserve" x="22" y="250" fill="#c9d1d9">  │  3. ‖ stop bump the version█                                       │</text>
    <text xml:space="preserve" x="22" y="269" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text xml:space="preserve" x="22" y="288" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="307" fill="#c9d1d9">     4. make the commit</text>
    <text xml:space="preserve" x="22" y="326" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="345" fill="#c9d1d9">    queue a prompt</text>
    <text xml:space="preserve" x="22" y="364" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="383" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="402" fill="#8b949e">  enter queue   ↑↓ pick and edit   ctrl+↑↓ move   ctrl+canc remove   esc</text>
