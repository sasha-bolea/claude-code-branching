  <g class="f" style="animation-delay:10.5s">
    <text xml:space="preserve" x="22" y="41" fill="#e8913a">  cb  branches of the conversation</text>
    <text xml:space="preserve" x="22" y="60" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="79" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="98" fill="#c9d1d9">  ●━━━●━━━●━━━●━┳━●━━━●━━━●━━━●</text>
    <text xml:space="preserve" x="22" y="117" fill="#c9d1d9">                ┗━●━┳━●━━━○</text>
    <text xml:space="preserve" x="22" y="136" fill="#c9d1d9">                    ┗━●━━━●━━━●</text>
    <text xml:space="preserve" x="22" y="155" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="174" fill="#c9d1d9">  what do I roll back?</text>
    <text xml:space="preserve" x="22" y="193" fill="#c9d1d9">  ▸ 1. the conversation and the files</text>
    <text xml:space="preserve" x="22" y="212" fill="#c9d1d9">    2. the conversation only (files stay as they are)</text>
    <text xml:space="preserve" x="22" y="231" fill="#c9d1d9">    3. the files only (the conversation stays where it is)</text>
    <text xml:space="preserve" x="22" y="250" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="269" fill="#c9d1d9">    ←→  the prompt you picked stays sent, with the answer it got</text>
    <text xml:space="preserve" x="22" y="288" fill="#c9d1d9">     r  [ ] remember this for next time</text>
    <text xml:space="preserve" x="22" y="307" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="326" fill="#c9d1d9">  The branch you leave is not lost: it stays in the tree, set aside.</text>
    <text xml:space="preserve" x="22" y="345" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="364" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</text>
    <text xml:space="preserve" x="22" y="383" fill="#8b949e">  ↑↓ 1-3 pick   enter confirm   esc back   canc exit</text>
  </g>
  <g class="f" style="animation-delay:14s">
    <text xml:space="preserve" x="22" y="41" fill="#e8913a">  cb  prompt queue</text>
    <text xml:space="preserve" x="22" y="60" fill="#c9d1d9">  they go out one at a time, when Claude finishes a turn</text>
