    <text xml:space="preserve" x="22" y="288" fill="#c9d1d9">  │                                                                    │</text>
    <text xml:space="preserve" x="22" y="307" fill="#c9d1d9">  │ typing in here█                                                    │</text>
    <text xml:space="preserve" x="22" y="326" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text xml:space="preserve" x="22" y="345" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="364" fill="#c9d1d9">  They belong to the folder, not to the conversation: they outlive /clear.</text>
    <text xml:space="preserve" x="22" y="383" fill="#c9d1d9"></text>
