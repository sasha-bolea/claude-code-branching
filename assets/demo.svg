<svg xmlns="http://www.w3.org/2000/svg" width="648" height="462" viewBox="0 0 648 462" font-family="SFMono-Regular, Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14">
  <style>
    .f { opacity: 0; animation: ciclo 21s infinite; }
    /* Se l'animazione non parte — una scheda in background, un lettore che le
       ignora — questa e' l'unica cosa che si vede, e deve essere una schermata
       vera invece del rettangolo vuoto. Durante l'animazione i keyframe vincono
       su questa regola, quindi non cambia niente. */
    .primo { opacity: 1 }
    @keyframes ciclo {
      0%   { opacity: 1 }
      16.500%  { opacity: 1 }
      16.667%  { opacity: 0 }
      100% { opacity: 0 }
    }
  </style>
  <rect width="648" height="462" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g class="f primo" style="animation-delay:0s">
    <text xml:space="preserve" x="22" y="41" fill="#e8913a">  cb  branches of the conversation</text>
