    <text xml:space="preserve" x="22" y="250" fill="#c9d1d9">  │ the branch you abandoned an hour ago, still here                   │</text>
    <text xml:space="preserve" x="22" y="269" fill="#c9d1d9">  ╰────────────────────────────────────────────────────────────────────╯</text>
    <text xml:space="preserve" x="22" y="288" fill="#c9d1d9"></text>
    <text xml:space="preserve" x="22" y="307" fill="#c9d1d9">  earlier: 3</text>
